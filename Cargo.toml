[package]
name = "esp-hal-rmt-onewire"
version = "0.4.0"
edition = "2021"
description = "RMT adapter for onewire with esp-hal and embassy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonored/esp-hal-rmt-onewire"

[features]
search-masks = []
esp32 = ["esp-hal/esp32", "esp-bootloader-esp-idf/esp32"]
esp32c3 = ["esp-hal/esp32c3", "esp-bootloader-esp-idf/esp32c3"]
esp32s3 = ["esp-hal/esp32s3", "esp-bootloader-esp-idf/esp32s3"]

[dependencies]
embassy-futures = { version = "0.1.1" }
esp-hal             = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["unstable"] }

[dev-dependencies]
static_cell = "2.1.1"
critical-section = "1.2.0"
embassy-sync = "0.7.2"
embassy-executor = { version = "0.9.1" }
esp-bootloader-esp-idf = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local" }
esp-backtrace       = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["panic-handler", "custom-halt"] }
esp-println         = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["timestamp", "critical-section", "uart"], default-features = false }
esp-hal             = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["unstable"] }
embassy-time = "0.5.0"
esp-rtos = { git = "https://github.com/emobotics-dev/esp-hal.git", branch = "local", features = ["embassy"] }
fixed = "1.28.0"

[package.metadata.docs.rs]
features = [ "esp-hal/esp32c3" ]
default-target = "riscv32imc-unknown-none-elf"
targets = ["riscv32imc-unknown-none-elf"]
