[package]
name = "esp-hal-rmt-onewire"
version = "0.4.0"
edition = "2021"
description = "RMT adapter for onewire with esp-hal and embassy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonored/esp-hal-rmt-onewire"

[features]
search-masks = []
esp32 = [
    "esp-hal/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-rtos/esp32",
]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-rtos/esp32c3",
]

[dependencies]
embassy-futures = { version = "0.1.1" }
esp-backtrace       = { path = "../esp-hal/esp-backtrace", features = ["esp32", "panic-handler", "custom-halt"] }
esp-bootloader-esp-idf = { path = "../esp-hal/esp-bootloader-esp-idf", features = ["esp32"] }
esp-println         = { path = "../esp-hal/esp-println", features = ["esp32", "timestamp", "critical-section", "uart"], default-features = false}
esp-hal             = { path = "../esp-hal/esp-hal", features = ["esp32","unstable"] }
static_cell = "2.1.1"
critical-section = "1.2.0"
embassy-sync = "0.7.2"

[dev-dependencies]
embassy-executor = { version= "0.9.1" }
esp-backtrace       = { path = "../esp-hal/esp-backtrace", features = ["esp32", "panic-handler", "custom-halt"] }
esp-println         = { path = "../esp-hal/esp-println", features = ["esp32", "timestamp", "critical-section", "uart"], default-features = false}
esp-hal             = { path = "../esp-hal/esp-hal", features = ["esp32","unstable"] }
embassy-time = "0.5.0"
esp-rtos = { version = "0.1.0", features = ["embassy"] }
fixed = "1.28.0"

[package.metadata.docs.rs]
features = [ "esp-hal/esp32c3" ]
default-target = "riscv32imc-unknown-none-elf"
targets = ["riscv32imc-unknown-none-elf"]
