[package]
name = "esp-hal-rmt-onewire"
version = "0.4.0"
edition = "2021"
description = "RMT adapter for onewire with esp-hal and embassy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jonored/esp-hal-rmt-onewire"

[features]
search-masks = []
esp32 = [
    "esp-hal/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-rtos/esp32",
]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-rtos/esp32c3",
]

[dependencies]
embassy-futures = { version = "0.1.1" }
esp-hal = { version = "1.0.0-rc.1", features = [ "unstable"] }
esp-bootloader-esp-idf = { version = "0.3.0" }
static_cell = "2.1.1"
critical-section = "1.2.0"
esp-backtrace = { version= "0.18.0", features=["println", "panic-handler"] }
embassy-sync = "0.7.2"

[dev-dependencies]
embassy-executor = { version= "0.9.1" }
esp-hal = { version = "1.0.0-rc.0"}
esp-backtrace = { version= "0.18.0", features=["println", "panic-handler"] }
esp-println = { version= "0.16.0"}
embassy-time = "0.5.0"
esp-rtos = { version = "0.1.0", features = ["embassy"] }
fixed = "1.28.0"

[package.metadata.docs.rs]
features = [ "esp-hal/esp32c3" ]
default-target = "riscv32imc-unknown-none-elf"
targets = ["riscv32imc-unknown-none-elf"]
